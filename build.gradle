plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'eu.simplecompliance'
version = '0.0.1-SNAPSHOT'
description = 'ubl-validator'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Schematron (ISO Schematron via XSLT) engine used to validate the UBL EN16931 rules
    implementation 'com.helger.schematron:ph-schematron-xslt:8.0.6'
    // JAXB runtime needed by ph-schematron to unmarshal the SVRL validation report
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
